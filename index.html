<style>
/* ======== ФОН НА ВСЮ СТРАНИЦУ ======== */
#animated-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url("https://static.tildacdn.com/tild6638-3862-4463-a566-363964373434/9aaf312cf2a952797bff.jpg") center center / cover no-repeat;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}


/* Чтобы фон не перекрывался секциями Tilda */
.t-records {
  position: relative;
  z-index: 1;
}


/* ======== ШАРЫ ======== */
.balloon {
  position: absolute;
  opacity: 0.9;
  animation: float 18s ease-in-out infinite;
  will-change: transform;
}


/* ======== АНИМАЦИЯ ПЛАВАНИЯ ======== */
@keyframes float {
  0%   { transform: translate(0, 0) rotate(0deg); }
  25%  { transform: translate(25px, -50px) rotate(6deg); }
  50%  { transform: translate(-35px, -100px) rotate(-6deg); }
  75%  { transform: translate(20px, -60px) rotate(4deg); }
  100% { transform: translate(0, 0) rotate(0deg); }
}
</style>


<div id="animated-bg">
  <img src="https://static.tildacdn.com/tild6334-3664-4136-b265-333537303834/Polish_20251028_1708.png" class="balloon" data-speed="0.1" style="width:80px; left:10%; top:10%; animation-delay:-2s;">
  <img src="https://static.tildacdn.com/tild6334-3664-4136-b265-333537303834/Polish_20251028_1708.png" class="balloon" data-speed="0.3" style="width:100px; left:30%; top:25%; animation-delay:-6s;">
  <img src="https://static.tildacdn.com/tild6334-3664-4136-b265-333537303834/Polish_20251028_1708.png" class="balloon" data-speed="0.2" style="width:70px; left:50%; top:40%; animation-delay:-9s;">
  <img src="https://static.tildacdn.com/tild6334-3664-4136-b265-333537303834/Polish_20251028_1708.png" class="balloon" data-speed="0.4" style="width:120px; left:70%; top:60%; animation-delay:-4s;">
  <img src="https://static.tildacdn.com/tild6334-3664-4136-b265-333537303834/Polish_20251028_1708.png" class="balloon" data-speed="0.15" style="width:90px; left:85%; top:30%; animation-delay:-8s;">
  <img src="https://static.tildacdn.com/tild6334-3664-4136-b265-333537303834/Polish_20251028_1708.png" class="balloon" data-speed="0.25" style="width:110px; left:15%; top:75%; animation-delay:-10s;">
  <img src="https://static.tildacdn.com/tild6334-3664-4136-b265-333537303834/Polish_20251028_1708.png" class="balloon" data-speed="0.35" style="width:95px; left:60%; top:85%; animation-delay:-12s;">
</div>


<script>
window.addEventListener('load', function() {


  const balloons = document.querySelectorAll('.balloon');


  window.addEventListener('scroll', function() {
    const scrolled = window.scrollY;


    balloons.forEach(function(el) {
      const speed = parseFloat(el.getAttribute('data-speed'));
      
      // Добавляем параллакс поверх анимации через CSS переменную
      el.style.transform = `translateY(${scrolled * speed}px)`;
    });
  });


});
</script>
